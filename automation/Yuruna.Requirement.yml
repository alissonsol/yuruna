# --- REGION: requirements
requirements:
  - tool: "PowerShell"
    command: |-
      "$($PSVersionTable.PSVersion) ($($PSVersionTable.PSEdition))"
    version: "7.6.6 (Core)"
    releases: "https://github.com/powershell/powershell/releases"
  - tool: "git"
    command: |-
      ((git --version) -replace '^git version ','')
    version: "2.53.0"
    releases: "https://git-scm.com/downloads"
  - tool: "python3"
    command: |-
      ((python3 --version) -replace '^Python ','')
    version: "3.14.4"
    releases: "https://www.python.org/downloads/"
  - tool: "OpenTofu"
    # The floor follows winget; standalone guest installs can use a newer patch.
    command: "($(tofu version -json) | ConvertFrom-Json).terraform_version"
    version: "1.13.0"
    releases: "https://opentofu.org/docs/intro/install/"
  - tool: "Helm"
    command: "helm version --short"
    version: "v4.3.0"
    releases: "https://github.com/helm/helm/releases"
  - tool: "Docker"
    # See https://yuruna.link/42e220c4-0016
    command: |-
      ((docker --version) -replace '^Docker version ','' -replace ',\s*build.*$','')
    version: "29.8.2"
    releases: "https://docs.docker.com/desktop/"
  - tool: "Docker buildx"
    # Ships as a CLI plugin inside Docker Desktop, so the floor follows the
    # Desktop-bundled plugin rather than the newest upstream buildx tag; see
    # the Docker entry above for why an upstream-leading floor misfires.
    command: |-
      ((docker buildx version) -split '\s+')[1]
    version: "v0.37.2"
    releases: "https://github.com/docker/buildx"
  - tool: "containerd"
    platforms: [linux]
    # `containerd --version` prints `containerd github.com/.../v2 vX.Y.Z <commit>` --
    # the third whitespace token is the version.
    command: |-
      ((containerd --version) -split '\s+')[2]
    version: "v2.3.3"
    releases: "https://github.com/containerd/containerd/releases"
  - tool: "Kubernetes"
    command: "($(kubectl version --client -o json) | ConvertFrom-Json).clientVersion.gitVersion"
    version: "v1.36.3"
    releases: "https://kubernetes.io/releases/"
  - tool: "Visual Studio Code"
    # `code -v` prints three lines (version / commit / arch); first line
    # is the version.
    command: "(code -v | Select-Object -First 1)"
    version: "1.132.0"
    releases: "https://code.visualstudio.com/Download"
  - tool: "mkcert"
    # mkcert writes its version banner to stderr -- the `2>&1` redirect
    # is required, otherwise the captured stdout is empty.
    command: "(mkcert -version 2>&1 | Select-Object -First 1)"
    version: "v1.4.4"
    releases: "https://github.com/filosottile/mkcert/releases"
  - tool: "node"
    # The Windows LTS package can lag the patch that nvm and Homebrew provide.
    command: "node --version"
    version: "v24.20.0"
    releases: "https://nodejs.org/en/download"
  - tool: "npm"
    # Tracks whatever the pinned Node LTS bundles, NOT npm's newest
    # release. Node 24 LTS ships npm 11.x; requiring a newer major would
    # fail this check on a correctly provisioned machine, since nothing
    # in the framework or the guest scripts installs npm separately.
    command: "npm --version"
    version: "11.19.0"
    releases: "https://docs.npmjs.com/cli/v11/configuring-npm/install"
  - tool: "curl"
    # First line is `curl X.Y.Z (build/triplet) libcurl/X.Y.Z ...`; the
    # paren-wrapped suffix is libcurl feature noise.
    command: |-
      ((curl --version | Select-Object -First 1) -replace '\s*\(.*$','')
    version: "curl 8.18.0"
    releases: "https://curl.se/download.html"
  - tool: "wget"
    command: "(wget --version 2>$null | Select-Object -First 1)"
    version: "GNU Wget 1.25.0"
    releases: "https://www.gnu.org/software/wget/"
  - tool: "tesseract"
    command: "(tesseract --version 2>&1 | Select-Object -First 1)"
    version: "tesseract 5.5.0"
    releases: "https://github.com/tesseract-ocr/tesseract/releases"
  - tool: "qemu-img"
    # See https://yuruna.link/42e220c4-0016
    command: |-
      $exe = (Get-Command qemu-img -ErrorAction SilentlyContinue).Source
      if (-not $exe -and $IsWindows) {
          $exe = @("$env:ProgramFiles\qemu\qemu-img.exe", "${env:ProgramFiles(x86)}\qemu\qemu-img.exe") |
              Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
      }
      if ($exe) { ((& $exe --version | Select-Object -First 1) -replace ',\s*Copyright.*$','') }
    version: "qemu-img version 10.2.1"
    releases: "https://www.qemu.org/download/"
  - tool: "oscdimg"
    platforms: [windows]
    # See https://yuruna.link/42e220c4-0016
    command: |-
      & {
          if (-not $IsWindows) { return }
          $PSNativeCommandUseErrorActionPreference = $false
          $exe = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools\*\Oscdimg\Oscdimg.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1
          if ($exe) {
              @(& $exe.FullName 2>&1 | ForEach-Object { "$_" }) |
                  Where-Object { $_ -match 'OSCDIMG' } | Select-Object -First 1
          }
      }
    version: "OSCDIMG 2.56"
    releases: "https://learn.microsoft.com/en-us/windows-hardware/get-started/adk-install"
  - tool: "AWS cli"
    # `aws-cli/X.Y.Z Python/X.Y.Z OS/build prompt/...`; everything past
    # the first whitespace is environment context, not version.
    command: |-
      ((aws --version) -replace '\s.*$','')
    version: "aws-cli/2.37.12"
    releases: "https://docs.aws.amazon.com/cli/latest/userguide/getting-started-install.html"
  - tool: "Azure cli"
    command: "($(az version) | ConvertFrom-Json).\"azure-cli\""
    version: "2.91.0"
    releases: "https://learn.microsoft.com/en-us/cli/azure/install-azure-cli"
  - tool: "Google Cloud"
    # No `-q` and no 2>&1 capture: a broken bundled-python install fails
    # silently rather than dumping a traceback into the version column.
    command: "(gcloud -v | Select-Object -First 1)"
    version: "Google Cloud SDK 588.0.0"
    releases: "https://cloud.google.com/sdk/docs/install-sdk"
