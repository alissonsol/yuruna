# GUID: 4256194d-b2a1-43ef-99e6-5f2a3eb4bc79
# Hyper-V overlay for ubuntu.server.base.user-data.
# Anchor sections in base-file order. An empty section emits nothing at that anchor.
# === YURUNA_OVERLAY_HOST_AGENT_PKG ===
    # See https://yuruna.link/42e220c4-0006
    # Empty: Hyper-V uses its KVP and MAC-keyed neighbor discovery paths.
# === YURUNA_OVERLAY_NETWORK ===
  # --- REGION: network
  # See https://yuruna.link/4220a755-000b
  # Pin the installer lease before /target exists.
  network:
    version: 2
    ethernets:
      yuruna-en:
        match:
          name: "en*"
        dhcp4: true
        dhcp-identifier: mac
        # netplan renders this as networkd KeepConfiguration=, which installs the DHCP address with an infinite kernel lifetime so a guest clock anomaly cannot expire it while the lease is valid.
        critical: true
      yuruna-eth:
        match:
          name: "eth*"
        dhcp4: true
        dhcp-identifier: mac
        # netplan renders this as networkd KeepConfiguration=, which installs the DHCP address with an infinite kernel lifetime so a guest clock anomaly cannot expire it while the lease is valid.
        critical: true
# === YURUNA_OVERLAY_SHUTDOWN ===
# === YURUNA_OVERLAY_EARLY_COMMANDS ===
  # --- REGION: early-commands
  early-commands:
    # --- REGION: https://yuruna.link/429f3d06-0025
    # Quiet the installer kernel; installed-system GRUB settings apply only after reboot.
    - dmesg -n 1 2>/dev/null || true
    # --- REGION: https://yuruna.link/429f3d06-009c
    # The live system's 15-minute tmpfiles-clean timer otherwise races curtin's /target/run unmount.
    - systemctl stop systemd-tmpfiles-clean.timer 2>/dev/null || true
# === YURUNA_OVERLAY_LATE_HOST_AGENT ===
    # --- REGION: https://yuruna.link/42dc5bb9-0004
    # Copy the journal to the COM1 UART this architecture has (ttyS0 on x64, ttyAMA0
    # on ARM64); the installer kernel already runs the target's architecture.
    # The service keeps a UART that stops draining from blocking journald, and sudo
    # and sshd behind it.
    # The unit's heredoc stays unquoted so $tty expands.
    - |
      tty=ttyS0; [ "$(uname -m)" = aarch64 ] && tty=ttyAMA0
      mkdir -p /target/usr/local/lib/yuruna /target/etc/systemd/system/sysinit.target.wants
      cat > /target/usr/local/lib/yuruna/serial-journal << 'EOF'
      #!/bin/sh
      journalctl --boot --lines=all --follow --no-pager --no-hostname --output=short-monotonic \
          _TRANSPORT=syslog _TRANSPORT=journal _TRANSPORT=stdout |
      while IFS= read -r line; do
          printf '%s\n' "$line" > "$1" || { sleep 1; printf '%s\n' "$line" > "$1"; }
      done
      EOF
      chmod 0755 /target/usr/local/lib/yuruna/serial-journal
      cat > /target/etc/systemd/system/yuruna-serial-journal.service << EOF
      # --- REGION: [Unit]
      [Unit]
      Description=Copy the journal to the serial console apart from journald
      DefaultDependencies=no
      After=systemd-journald.service
      StartLimitIntervalSec=0

      # --- REGION: [Service]
      [Service]
      ExecStart=/usr/local/lib/yuruna/serial-journal /dev/$tty
      StandardOutput=null
      StandardError=null
      Restart=always
      RestartSec=5

      # --- REGION: [Install]
      [Install]
      WantedBy=sysinit.target
      EOF
      ln -sf /etc/systemd/system/yuruna-serial-journal.service /target/etc/systemd/system/sysinit.target.wants/yuruna-serial-journal.service
# === YURUNA_OVERLAY_GRUB_PRE_CONSOLE_QUIET ===
    # --- REGION: https://yuruna.link/42dc5bb9-0004
    # Name the same UART on the kernel cmdline; tty0 stays last so the framebuffer
    # the OCR reads remains the primary console.
    # The single-quoted printf format keeps ${GRUB_CMDLINE_LINUX_DEFAULT} literal for GRUB.
    - |
      tty=ttyS0; [ "$(uname -m)" = aarch64 ] && tty=ttyAMA0
      printf 'GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} console=%s,115200n8 console=tty0"\n' "$tty" > /target/etc/default/grub.d/98-yuruna-serial.cfg
    # --- REGION: https://yuruna.link/429f3d06-001e
    - |
      mkdir -p /target/etc/dpkg/dpkg.cfg.d
      cat > /target/etc/dpkg/dpkg.cfg.d/99-yuruna-unsafe-io << 'DPKGCFG'
      force-unsafe-io
      DPKGCFG
    # --- REGION: https://yuruna.link/429f3d06-001f
    - |
      cat > /target/etc/modprobe.d/denylist-hv-balloon.conf << 'MODPROBE'
      blacklist hv_balloon
      MODPROBE
    # --- REGION: https://yuruna.link/429f3d06-0020
    - |
      cat > /target/etc/default/grub.d/99-yuruna-hyperv-fb.cfg << 'GRUBCFG'
      GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} video=hyperv_fb:1024x768"
      GRUBCFG
# === YURUNA_OVERLAY_GRUB_POST_CONSOLE_QUIET ===
