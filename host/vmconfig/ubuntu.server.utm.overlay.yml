# macOS/UTM (QEMU) overlay for ubuntu.server.base.user-data.
# Anchor sections in base-file order. An empty section emits nothing at that anchor.
# === YURUNA_OVERLAY_NETWORK ===
  # --- REGION: https://yuruna.link/429f3d06-0015
  # --- REGION: https://yuruna.link/4220a755-000b
  # dhcp-identifier belongs here and not only in the in-target netplan patch:
  # the installer runs its own DHCP client before /target exists, so a pin
  # applied in late-commands leaves the INSTALL asking under a machine-id DUID
  # and the installed system asking under the MAC. That is two leases drawn
  # from a shared pool for one guest, every build.
  network:
    version: 2
    ethernets:
      enp0s1:
        dhcp4: true
        dhcp6: false
        accept-ra: false
        dhcp-identifier: mac
# === YURUNA_OVERLAY_EARLY_COMMANDS ===
  early-commands:
    # --- REGION: https://yuruna.link/429f3d06-0025
    # The INSTALLED system gets `quiet loglevel=3` from a grub drop-in in
    # late-commands. That drop-in cannot help the INSTALLER: it governs the kernel
    # the guest boots after this, while the phase a host has to read by OCR is
    # this one -- and there is no seam for the installer's own kernel cmdline
    # short of remastering the ISO. Lower the console log level from inside the
    # installer environment instead, so kernel and journal-forwarded chatter stops
    # painting over the prompt the host is waiting to match. What is suppressed
    # here is still recorded in the journal and in /var/log/installer, which is
    # what the failure archive collects.
    #
    # This does NOT silence everything. The installer's own progress output is not
    # journal traffic and stays on the console by design, so a console that fills
    # with repeating installer log lines remains possible -- which is why the OCR
    # wait has to classify that case rather than only time out on it.
    - dmesg -n 1 2>/dev/null || true
# === YURUNA_OVERLAY_GRUB_PRE_CONSOLE_QUIET ===
# === YURUNA_OVERLAY_GRUB_POST_CONSOLE_QUIET ===
# === YURUNA_OVERLAY_HOST_AGENT_PKG ===
  # Empty: this host reads the guest agent through `utmctl ip-address`, which
  # UTM wires to its own bundled channel, and falls back to the shared-NAT
  # lease file and a bundle-MAC ARP match. Installing the agent from this
  # seed would not change which of those three answers, so the package set
  # of a currently-healthy guest stays untouched.
# === YURUNA_OVERLAY_LATE_HOST_AGENT ===
    # Empty: nothing to enable -- see the package section above.
