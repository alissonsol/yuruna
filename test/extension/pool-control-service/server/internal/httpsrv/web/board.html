<!doctype html>
<!--
  LICENSEURI https://yuruna.link/license
  Copyright (c) 2019-2026 by Alisson Sol et al.

  The operator board: how is each pool doing, and give a pool a test set.
  Built for a phone first -- one column, big targets, no table.

  Script and style ship as same-origin /assets files, NOT inline: the CSP served
  with every page is `script-src 'self'` with no nonce and no hash, so an inline
  <script> would be blocked and this page would render as a dead skeleton.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Board &mdash; Yuruna Pool Control</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/board.css">
</head>
<body class="board has-footer-bar">
  <header class="app">
    <div class="brand">
      <span class="name"><a href="/">Yuruna Pool Control</a></span>
      <span class="version" id="header-version"></span>
    </div>
    <span class="spacer"></span>
    <span class="machine" id="machine"></span>
    <div class="menu">
      <button type="button" class="menu-button" id="menu-button" aria-haspopup="true" aria-expanded="false" aria-controls="menu-panel">
        <span class="menu-icon" aria-hidden="true">&#9776;</span><span class="menu-label">Menu</span>
      </button>
      <nav class="menu-panel" id="menu-panel" aria-label="Pages" hidden>
        <a href="/" aria-current="page">Board</a>
        <a href="/assign">Assign</a>
        <a href="/hosts">Hosts</a>
        <a href="/pools">Pools</a>
        <a href="/test-sets">Test sets</a>
        <a href="/scan">Scan</a>
        <a href="/diagnostics">Diagnostics</a>
        <a class="menu-out" href="https://yuruna.link/pool-control" target="_blank" rel="noopener">Guide</a>
      </nav>
    </div>
  </header>

  <!-- Reads are open, so the board renders for anyone on the LAN. The Lab-token
       prompt is built by Y.unlock at the moment a change is attempted, which is
       the same prompt every other page in this service shows. -->

  <main id="board" hidden>
    <h1>Board</h1>
    <!-- role="group", not <nav>: these are toggles that change what the cards
         below show, not links to anywhere. aria-pressed carries the selected
         state, and board.css deliberately keeps a visible border and a
         heavier weight on the selected one so the state survives grayscale
         too. -->
    <div class="periods" role="group" aria-label="Time period">
      <button type="button" data-range="1h" aria-pressed="false">1h</button>
      <button type="button" data-range="24h" class="on" aria-pressed="true">24h</button>
      <button type="button" data-range="7d" aria-pressed="false">7d</button>
      <button type="button" data-range="30d" aria-pressed="false">30d</button>
    </div>
    <p id="stats-banner" role="status" class="stats-banner" hidden></p>
    <div id="cards"></div>
    <p id="empty" role="status" class="muted" hidden>No pools yet. Create one from Menu &rarr; Pools.</p>
  </main>

  <!-- Confirmation. The failure mode here is a mis-tap, so the blast radius is
       spelled out before anything is written. -->
  <div id="confirm" class="sheet" hidden>
    <div class="sheet-box" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h2 id="confirm-title">Assign test set?</h2>
      <p id="confirm-body"></p>
      <div class="sheet-actions">
        <button id="confirm-cancel" class="ghost">Cancel</button>
        <button id="confirm-ok">Assign</button>
      </div>
    </div>
  </div>

  <footer id="footer-bar">
    <span id="footer-ips"><span class="label" id="footer-ips-label">IPs:</span><textarea id="footer-ip-list" readonly rows="1" spellcheck="false" inputmode="none" autocorrect="off" autocapitalize="off" aria-labelledby="footer-ips-label">--</textarea></span>
    <span>Loaded: <span id="last-loaded">--</span><span id="footer-busy" aria-hidden="true" hidden></span></span>
    <span><button type="button" id="footer-refresh" class="linkish">Refresh</button>: <span id="countdown">60</span>s <button type="button" id="footer-pause" class="linkish" aria-pressed="false">Pause</button></span>
  </footer>

  <!-- The shared runtime first: it installs the baseline shims (fetch, KeyboardEvent.key)
       and defines Y, which every script below extends rather than rebuilds. -->
  <script src="/assets/yuruna.core.js"></script>
  <script src="/assets/common.js"></script>
  <script src="/assets/board.js"></script>
</body>
</html>
