  The operator board: how is each pool doing, and give a pool a test set.
  Built for a phone first -- one column, big targets, no table.

  Script and style ship as same-origin /assets files, NOT inline: the CSP served
  with every page is `script-src 'self'` with no nonce and no hash, so an inline
  <script> would be blocked and this page would render as a dead skeleton.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yuruna pools</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/board.css">
</head>
<body class="board">
  <header class="board-top">
    <span class="brand">Yuruna pools</span>
    <a class="advanced-link" href="/advanced">Advanced</a>
  </header>

  <!-- Passcode prompt. Hidden unless /api/session says a gate exists and this
       device is not through it. -->
  <section id="login" class="login" hidden>
    <h1>Enter the lab passcode</h1>
    <form id="login-form">
      <input id="passcode" type="password" inputmode="numeric" autocomplete="current-password"
             placeholder="Passcode" aria-label="Lab passcode">
      <button type="submit">Continue</button>
    </form>
    <p id="login-error" class="login-error" hidden></p>
  </section>

  <main id="board" hidden>
    <nav class="periods" aria-label="Time period">
      <button data-range="1h">1h</button>
      <button data-range="24h" class="on">24h</button>
      <button data-range="7d">7d</button>
      <button data-range="30d">30d</button>
    </nav>
    <p id="stats-banner" class="stats-banner" hidden></p>
    <div id="cards"></div>
    <p id="empty" class="muted" hidden>No pools yet. Create one from Advanced &rarr; Pools.</p>
  </main>

  <!-- Confirmation. The failure mode here is a mis-tap, so the blast radius is
       spelled out before anything is written. -->
  <div id="confirm" class="sheet" hidden>
    <div class="sheet-box" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h2 id="confirm-title">Assign test set?</h2>
      <p id="confirm-body"></p>
      <div class="sheet-actions">
        <button id="confirm-cancel" class="ghost">Cancel</button>
        <button id="confirm-ok">Assign</button>
      </div>
    </div>
  </div>

  <script src="/assets/common.js"></script>
  <script src="/assets/board.js"></script>
</body>
</html>
