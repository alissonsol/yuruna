<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yuruna Pool Control &mdash; Assign</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="has-footer-bar">
  <header class="app">
    <div class="brand">
      <span>Yuruna Pool Control</span>
      <span class="version" id="header-version"></span>
    </div>
    <nav>
      <a href="/assign" class="active">Assign</a>
      <a href="/pools">Pools</a>
      <a href="/test-sets">Test sets</a>
    </nav>
    <span class="spacer"></span>
    <span class="machine" id="machine"></span>
  </header>
  <main>
    <h1>Assign test sets to pools</h1>
    <p class="muted">Each pool tests one test-set (a framework + project repo pair). GH_TOKEN stays host-local &mdash; it is never stored in pool intent.</p>
    <div id="notice" class="notice"></div>
    <div class="row"><button id="refresh">Refresh</button></div>
    <table>
      <thead>
        <tr><th>Pool</th><th>Pool ID</th><th>Assign test set</th><th>Framework / Project</th><th>Members</th><th>State</th></tr>
      </thead>
      <tbody id="pool-rows"></tbody>
    </table>
  </main>
  <footer id="footer-bar">
    <span id="footer-ips"><span class="label">IPs:</span><textarea id="footer-ip-list" readonly rows="1" spellcheck="false" inputmode="none" autocorrect="off" autocapitalize="off" aria-label="Server IP addresses">—</textarea></span>
    <span>Loaded: <span id="last-loaded">—</span></span>
    <span><a id="footer-refresh" href="#">Refresh</a>: <span id="countdown">60</span>s · <a href="https://yuruna.link/pool-control">guide</a></span>
  </footer>
  <script src="/assets/common.js"></script>
  <script src="/assets/index.js"></script>
</body>
</html>
