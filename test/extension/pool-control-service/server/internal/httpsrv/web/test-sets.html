<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Test sets &mdash; Yuruna Pool Control</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="has-footer-bar">
  <header class="app">
    <div class="brand">
      <span class="name"><a href="/">Yuruna Pool Control</a></span>
      <span class="version" id="header-version"></span>
    </div>
    <span class="spacer"></span>
    <span class="machine" id="machine"></span>
    <div class="menu">
      <button type="button" class="menu-button" id="menu-button" aria-haspopup="true" aria-expanded="false" aria-controls="menu-panel">
        <span class="menu-icon" aria-hidden="true">&#9776;</span><span class="menu-label">Menu</span>
      </button>
      <nav class="menu-panel" id="menu-panel" aria-label="Pages" hidden>
        <a href="/">Board</a>
        <a href="/assign">Assign</a>
        <a href="/hosts">Hosts</a>
        <a href="/pools">Pools</a>
        <a href="/test-sets" aria-current="page">Test sets</a>
        <a href="/scan">Scan</a>
        <a href="/diagnostics">Diagnostics</a>
        <a class="menu-out" href="https://yuruna.link/4207d71a-000c" target="_blank" rel="noopener">Guide</a>
      </nav>
    </div>
  </header>
  <main>
    <h1>Test sets</h1>
    <p class="muted">A test set is a framework + project repo pair. GH_TOKEN is <strong>not</strong> stored here &mdash;
      it stays host-local on each host's test.config.yml / vault.</p>
    <div id="notice" role="alert" class="notice"></div>
    <div class="row">
      <label class="labeled-field">
        <span class="scan-label">Name</span>
        <input id="ts-name" size="16">
      </label>
      <label class="labeled-field">
        <span class="scan-label">Framework URL</span>
        <input id="ts-framework" size="40">
      </label>
      <label class="labeled-field">
        <span class="scan-label">Project URL</span>
        <input id="ts-project" size="40">
      </label>
      <button id="save" class="primary">Save test set</button>
    </div>
    <table>
      <thead>
        <tr>
          <th class="rownum" aria-label="Row number">#</th>
          <th data-sort="name" aria-sort="ascending"><button type="button" class="sort">Name</button></th>
          <th data-sort="frameworkUrl"><button type="button" class="sort">Framework URL</button></th>
          <th data-sort="projectUrl"><button type="button" class="sort">Project URL</button></th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="ts-rows"></tbody>
    </table>
  </main>
  <footer id="footer-bar">
    <span id="footer-ips"><span class="label" id="footer-ips-label">IPs:</span><textarea id="footer-ip-list" readonly rows="1" spellcheck="false" inputmode="none" autocorrect="off" autocapitalize="off" aria-labelledby="footer-ips-label">--</textarea></span>
    <span>Loaded: <span id="last-loaded">--</span><span id="footer-busy" aria-hidden="true" hidden></span></span>
    <span><button type="button" id="footer-refresh" class="linkish">Refresh</button>: <span id="countdown">60</span>s <button type="button" id="footer-pause" class="linkish" aria-pressed="false">Pause</button></span>
  </footer>
  <!-- The shared runtime first: it installs the baseline shims (fetch, KeyboardEvent.key)
       and defines Y, which every script below extends rather than rebuilds. -->
  <script src="/assets/yuruna.core.js"></script>
  <script src="/assets/common.js"></script>
  <script src="/assets/test-sets.js"></script>
</body>
</html>
