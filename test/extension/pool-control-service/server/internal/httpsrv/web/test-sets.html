<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Test sets &mdash; Yuruna Pool Control</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="has-footer-bar">
  <header class="app">
    <div class="brand">
      <span class="name"><a href="/">Yuruna Pool Control</a></span>
      <span class="version" id="header-version"></span>
    </div>
    <span class="spacer"></span>
    <span class="machine" id="machine"></span>
    <div class="menu">
      <button type="button" class="menu-button" id="menu-button" aria-haspopup="true" aria-expanded="false" aria-controls="menu-panel">
        <span class="menu-icon" aria-hidden="true">&#9776;</span><span class="menu-label">Menu</span>
      </button>
      <nav class="menu-panel" id="menu-panel" aria-label="Pages" hidden>
        <a href="/">Board</a>
        <a href="/assign">Assign</a>
        <a href="/hosts">Hosts</a>
        <a href="/pools">Pools</a>
        <a href="/test-sets" aria-current="page">Test sets</a>
        <a href="/diagnostics">Diagnostics</a>
        <a class="menu-out" href="https://yuruna.link/pool-control">Guide</a>
      </nav>
    </div>
  </header>
  <main>
    <h1>Test sets</h1>
    <p class="muted">A test set is a framework + project repo pair. GH_TOKEN is <strong>not</strong> stored here &mdash; it stays host-local on each host's test.config.yml / vault.</p>
    <div id="notice" class="notice"></div>
    <div class="row">
      <input id="ts-name" placeholder="name" size="16">
      <input id="ts-framework" placeholder="frameworkUrl" size="40">
      <input id="ts-project" placeholder="projectUrl" size="40">
      <button id="save" class="primary">Save test set</button>
    </div>
    <table>
      <thead><tr><th>Name</th><th>Framework URL</th><th>Project URL</th><th>Actions</th></tr></thead>
      <tbody id="ts-rows"></tbody>
    </table>
  </main>
  <footer id="footer-bar">
    <span id="footer-ips"><span class="label">IPs:</span><textarea id="footer-ip-list" readonly rows="1" spellcheck="false" inputmode="none" autocorrect="off" autocapitalize="off" aria-label="Server IP addresses">—</textarea></span>
    <span>Loaded: <span id="last-loaded">—</span></span>
    <span><a id="footer-refresh" href="#">Refresh</a>: <span id="countdown">60</span>s</span>
  </footer>
  <script src="/assets/common.js"></script>
  <script src="/assets/test-sets.js"></script>
</body>
</html>
