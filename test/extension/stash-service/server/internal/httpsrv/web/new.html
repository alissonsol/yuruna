<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>New stash &mdash; Yuruna Stash</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="has-footer-bar">
  <header class="app">
    <div class="brand">
      <span class="name"><a href="/">Yuruna Stash</a></span>
      <span class="version" id="header-version"></span>
    </div>
    <span class="spacer"></span>
    <span class="machine" id="machine"></span>
    <div class="menu">
      <button type="button" class="menu-button" id="menu-button" aria-haspopup="true" aria-expanded="false" aria-controls="menu-panel">
        <span class="menu-icon" aria-hidden="true">&#9776;</span><span class="menu-label">Menu</span>
      </button>
      <nav class="menu-panel" id="menu-panel" aria-label="Pages" hidden>
        <a href="/">Stashes</a>
        <a href="/new" aria-current="page">New stash</a>
        <a class="menu-out" href="https://yuruna.link/42f5e921" target="_blank" rel="noopener">Guide</a>
      </nav>
    </div>
  </header>
  <main>
    <h1>New stash</h1>
    <div id="msg" role="alert"></div>
    <!-- Real buttons, not styled divs. The upload form below starts hidden and
         these are the only thing that reveals it, so as <div>s they put one of
         the page's two core tasks out of reach of a keyboard entirely. Buttons
         are focusable and fire click on Enter and Space, so no key handling is
         needed in new.js. -->
    <div class="tabs" role="tablist">
      <button type="button" class="tab active" id="tab-text" role="tab"
              aria-selected="true" aria-controls="form-text">Paste text</button>
      <button type="button" class="tab" id="tab-files" role="tab"
              aria-selected="false" aria-controls="form-files">Upload file(s)</button>
    </div>

    <form class="create" id="form-text" role="tabpanel" aria-labelledby="tab-text">
      <label for="title">Title / filename (optional)</label>
      <input type="text" id="title" name="title" placeholder="notes.txt">
      <label for="author">Author (optional)</label>
      <input type="text" id="author" name="author" placeholder="web">
      <label for="text">Content</label>
      <textarea id="text" name="text" placeholder="Paste content here..."></textarea>
      <div class="actions">
        <button class="btn primary" type="submit">Create stash</button>
      </div>
    </form>

    <form class="create" id="form-files" role="tabpanel" aria-labelledby="tab-files" style="display:none">
      <label for="author2">Author (optional)</label>
      <input type="text" id="author2" name="author" placeholder="web">
      <label for="files">File(s) -- multiple files are grouped into one ZIP</label>
      <input type="file" id="files" name="files" multiple>
      <div class="actions">
        <button class="btn primary" type="submit">Upload stash</button>
      </div>
    </form>
  </main>
  <!-- The shared footer bar, minus its refresh countdown. This page holds an
       unsaved form, and a bar that reloads on a timer would silently discard
       whatever has been typed into it; no #countdown element means initFooter
       never starts that tick. -->
  <footer class="app" id="footer-bar">
    <span id="footer-ips"><span class="label" id="footer-ips-label">IPs:</span><textarea id="footer-ip-list" readonly rows="1" spellcheck="false" inputmode="none" autocorrect="off" autocapitalize="off" aria-labelledby="footer-ips-label">--</textarea></span>
    <span>Loaded: <span id="last-loaded">--</span></span>
  </footer>
  <!-- The shared runtime first: it installs the baseline shims (fetch, KeyboardEvent.key)
       and defines Y, which every script below extends rather than rebuilds. -->
  <script src="/assets/yuruna.core.js"></script>
  <script src="/assets/common.js"></script>
  <script src="/assets/new.js"></script>
</body>
</html>
