active:
  - default
service:
  displayName: Stash service
  vmName: yuruna-stash-service
  healthPort: 80
  healthPath: /healthz
  startScript: Start-StashServiceVM.ps1
  stopScript: Stop-StashServiceVM.ps1
  markerBaseUrlKey: stashBaseUrl
  beaconInterval: 2m
  # DELETE is the one destructive verb here, and it reaches every host's stash
  # on the share, so it carries the same gate as any other destructive route in
  # the lab. Reads and creates stay open.
  writeGate: lab-token
