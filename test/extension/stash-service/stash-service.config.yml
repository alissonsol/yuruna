active:
  - default
service:
  displayName: Stash service
  vmName: yuruna-stash-service
  healthPort: 80
  healthPath: /healthz
  startScript: Start-StashServiceVM.ps1
  stopScript: Stop-StashServiceVM.ps1
  markerBaseUrlKey: stashBaseUrl
  beaconInterval: 15m
  # DELETE is restricted to the VM itself and the deploying host, which is a
  # narrower rule than the lab token, not a looser one -- and a stash holds
  # artifacts, not host or pool configuration.
  writeGate: none
