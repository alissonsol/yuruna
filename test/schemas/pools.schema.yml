$schema: https://json-schema.org/draft/2020-12/schema
$id: https://yuruna.com/schemas/pools.schema.yml
title: Yuruna pool definitions
description: >
  The slow-changing pool INTENT, authored by the operator (pool admin CLI) and
  pulled by each runner over the LAN from the bare git repo on the caching-proxy-service.
  `members[]` (a list of stable hostIds) is the SINGLE source of truth for which
  host belongs to which pool: a runner finds its own pool by locating its hostId
  here (a host belongs to AT MOST one pool); the aggregator labels each host's
  telemetry by the same mapping. `desiredState` gates the runner
  (run/paused/drain); `testSet` (a single framework/project repo pair) is what
  a pooled host tests; `config` overrides the per-host testCycle knobs; `gating`
  is the advisory pool alert/quorum policy the aggregator + host notifier act on.

type: object
required: [schemaVersion, pools]
additionalProperties: false

properties:

  schemaVersion:
    type: integer
    const: 2
    description: >
      Schema contract version. v2: a pool carries a stable `poolGuid` and a
      single `testSet` (a named framework/project repo pair), replacing the v1
      `testSets[]` array of sequence-manifest references.

  pools:
    type: array
    description: All pools defined for this LAN. One file holds every pool.
    items: { $ref: "#/$defs/pool" }

  autoEnrollment:
    type: object
    description: >
      PHASE A (permit-only): declared here so every intent WRITER accepts a
      document containing it before any writer emits it. Every admin write
      re-validates the WHOLE document against the writing checkout's own copy of
      this schema, and this file is `additionalProperties: false` at the root --
      so a store written by a newer checkout would otherwise fail validation on
      every older one, breaking pool administration LAN-wide. Ship this schema
      everywhere first; only then start writing the block.

      Policy for the sweep that adds lab-token-enrolled hosts to a pool
      automatically. A host is a candidate only when the aggregator reports
      `control: ready` for it AND it belongs to no pool at all, so the
      "a host is in at most one pool" invariant holds by construction.
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        description: >
          Master switch for the auto-enrolment sweep across this LAN. Default
          false: the feature ships off and is turned on deliberately.
      targetPoolId:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
        description: >
          The pool auto-enrolled hosts land in (conventionally `default`). This
          pool is FORBIDDEN from carrying a testSet -- hosts arrive here without
          anyone choosing it for them, so a test-set here would silently repoint
          every auto-enrolled host in the lab. Enforced in code
          (Test-PoolIntent.ps1 / Set-PoolTestSet.ps1), because a cross-field
          constraint of this shape is not expressible in JSON Schema.
      excluded:
        type: array
        description: >
          Hosts an operator removed from the target pool by hand. The sweep
          never re-adds these. Without it, removing a host and the 60-second
          sweep would fight forever and the UI would look broken.
        items:
          type: string
          pattern: "^42[0-9a-fA-F]{30}$"

$defs:

  pool:
    type: object
    required: [poolId, poolGuid]
    additionalProperties: false
    properties:

      poolId:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
        description: >
          DNS-label-safe pool identifier. This is the Loki/Prometheus label
          value and is IMMUTABLE once telemetry has accumulated under it --
          renaming it forks the history.

      poolGuid:
        type: string
        pattern: "^42[0-9a-fA-F]{6}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
        description: >
          Stable 42-prefixed GUID minted at pool creation. Surfaced as the
          dashboard "Pool ID" column; unlike poolId it is opaque and never
          reused. Distinct from poolId so the human-facing GUID and the
          telemetry label can evolve independently.

      displayName:
        type: string
        description: Human-friendly label shown on the dashboard. Default "".

      members:
        type: array
        description: >
          Stable hostIds (42-prefixed 32-hex, from runtime/host.uuid) in this
          pool. The single source of truth for membership; order is not
          significant. A host learns its own pool by finding its hostId here.
        items:
          type: string
          pattern: "^42[0-9a-fA-F]{30}$"

      testSet:
        type: object
        description: >
          The single test-set assigned to this pool: a named framework +
          project repo pair. A pooled runner overrides its own
          repositories.frameworkUrl / repositories.projectUrl with these for the
          cycle (its GH_TOKEN stays host-local, never in pool intent) and then
          runs the assigned project's own test.runner.yml. Absent until assigned.
        required: [name, frameworkUrl, projectUrl]
        additionalProperties: false
        properties:
          name:
            type: string
            pattern: "^[a-z0-9][a-z0-9._-]*$"
            description: >
              Test-set name. Discovered entries are project-scoped by
              construction -- `<project-slug>.<setName>` -- because this name is
              the SOLE key the library upserts and deletes on, and every project
              reports an implicit set called `all`; a bare name would have one
              project's `all` overwrite every other's.
          frameworkUrl:
            type: string
            description: The Yuruna framework repo URL each pooled host clones for the cycle.
          projectUrl:
            type: string
            description: The project repo URL each pooled host tests (its test.runner.yml drives the cycle).
          sequences:
            type: array
            description: >
              PHASE A (permit-only): see the note on `autoEnrollment`.

              Optional subset of the assigned project's top-level sequences to
              run. ABSENT or EMPTY means run the project's whole
              test.runner.yml, which is the behaviour every existing store
              relies on -- so an older runner that ignores this field runs a
              safe superset rather than nothing.
            items:
              type: string

      config:
        type: object
        description: >
          Per-pool overrides of the testCycle.* knobs. The runner's outer loop merges
          config.testCycle over each host's test.config.yml (override WINS: pool >
          config > default), so a pool can engage auto-remediation or tighten the step
          timeout fleet-wide without editing every host.
        additionalProperties: false
        properties:
          testCycle:
            type: object
            description: Overrides mirroring the test.config.yml testCycle block.
            additionalProperties: true

      gating:
        type: object
        description: >
          Advisory pool alert/quorum policy. The aggregator computes a `degraded` flag
          when the healthy-member fraction stays below the threshold for the sustained
          window, latches an alert with poll-count hysteresis, and the host-side notifier
          delivers it. Advisory only: no host reads it to gate a cycle. Authoring an
          (even empty) gating block opts the pool into alerting; a pool with no gating is
          observed via the gauges but never paged.
        additionalProperties: false
        properties:
          failuresBeforeAlert:
            type: integer
            minimum: 1
            description: Consecutive degraded polls before a pool alert fires. Default 3.
          successesBeforeRearm:
            type: integer
            minimum: 1
            description: Consecutive non-degraded polls before the alert re-arms. Default 2.
          quorum:
            type: object
            additionalProperties: false
            properties:
              healthyThreshold:
                type: number
                minimum: 0
                maximum: 1
                description: Fraction of members that must be healthy. Default 0.5.
              degradedAfterSeconds:
                type: integer
                minimum: 0
                description: Seconds below the threshold before the pool is "degraded". Default 1800.

      desiredState:
        type: string
        enum: [run, paused, drain]
        description: >
          Gates the runner (pulled intent, mirroring the
          local control.cycle-restart flag). run = cycle normally; paused = finish
          the in-flight cycle then hold; drain = stop after the current cycle.
          Default "run" when absent.
