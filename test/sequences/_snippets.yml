# The first keystroke into a cold console (just-redrawn login: prompt) is
# swallowed while the tty input layer is still draining, so on KVM the
# leading character of the username is lost. Pressing Enter and pausing lets
# agetty settle so the subsequent passwdPrompt types into a stable prompt.
firstLoginPrime:
  - action: waitForText
    pattern: "login:"
    timeoutSeconds: 600
    description: "OCR: login:"

  - action: pressKey
    name: Enter
    description: "Enter"

  - action: waitForSeconds
    seconds: 2
    description: "Pause: agetty redraw"
