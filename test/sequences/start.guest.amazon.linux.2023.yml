sequenceGuid: 4224b44c-5e04-47e8-a61b-865d2a191b84
sequenceRevision: 1

description: "Amazon Linux 2023: first login, change password, run update script, reboot."
keystrokeMechanism: gui
resource:
  amazon.linux.2023: []
variables:
  username: yauser1
  currentPassword: ${ext:authentication.GetPassword(${username})}
  newPassword: ${ext:authentication.NewRandomPassword()}

component:
  - action: retry
    maxAttempts: 3
    description: "Login, password rotation, and vault commit (restart on timeout)"
    steps:
      # The nudge comes BEFORE the wait, and that ordering is the whole point.
      # agetty prints "login:" once and does not reprint it; cloud-init's
      # closing console writes (the SSH host-key banner is the long one) land
      # after it and scroll it away. The prompt is then gone from a screen that
      # never changes again, so an OCR wait for it can only spend its full
      # budget. An ordering that waited first and nudged second would put the
      # recovery downstream of the very step it exists to unblock, and since a
      # retry attempt restarts at this step, no attempt would ever reach it.
      #
      # Enter is safe to send unconditionally: at a prompt it draws a fresh
      # one, and mid-boot it is discarded. Every retry attempt issues it, so a
      # prompt overwritten during one attempt is recovered by the next.
      - action: pressKey
        name: Enter
        description: "Push agetty to redraw a fresh login"

      - action: waitForSeconds
        seconds: 2
        description: "Let agetty redraw"

      - action: waitForText
        pattern: "login:"
        timeoutSeconds: 300
        description: "OCR: login:"

      - action: passwdPrompt
        pattern: "login:"
        text: "${username}"
        description: "OCR: login:"

      - action: passwdPrompt
        pattern: "Password:"
        text: "${currentPassword}"
        description: "OCR: Password:"

      - action: passwdPrompt
        pattern: ["Current password", "urrent password:"]
        text: "${currentPassword}"
        description: "OCR: Current password"

      - action: passwdPrompt
        pattern: ["New password", "ew password:"]
        text: "${newPassword}"
        description: "OCR: New password"

      - action: passwdPrompt
        pattern: ["Retype new password", "etype new password:"]
        text: "${newPassword}"
        description: "OCR: Retype new password"

      - action: callExtension
        method: authentication.SetPassword
        args:
          Username: "${username}"
          NewPassword: "${newPassword}"
        description: "Commit new password to auth system"

workload:
  - action: fetchAndExecute
    text: "/usr/local/lib/yuruna/fetch-and-execute.sh guest/amazon.linux.2023/amazon.linux.2023.update.sh"
    description: "amazon.linux.2023.update.sh"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 1800

  - action: saveSystemDiagnostic
    id: yuruna.update
    description: "Capture diagnostics"

  - action: inputTextAndEnter
    text: "clear; sudo reboot now"
    description: "Reboot the VM"
