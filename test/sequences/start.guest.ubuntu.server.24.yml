sequenceGuid: 42946cbc-c2ec-48e4-a4ba-8e25a71c1286
sequenceRevision: 3

description: "Ubuntu Server 24.04: first login, change password, run update script, reboot."
keystrokeMechanism: gui
resource:
  ubuntu.server.24: []
variables:
  username: yuuser24
  currentPassword: ${ext:authentication.GetPassword(${username})}
  newPassword: ${ext:authentication.NewRandomPassword()}

component:
  # subiquity asks this once and never asks again. It does not reprint on an
  # empty line either -- only a literal yes or no moves it -- so the question can
  # scroll out of the visible surface while the installer goes on waiting for an
  # answer behind a screen that no longer shows what it wants. Its network
  # controller writes a start:/finish: status pair per link event to the same
  # console, which is what does the scrolling; anything that delays this step
  # past the guest's own boot (an operator hold, a slow host) lands on that
  # screen. The pattern is then unreadable and unrecoverable, but the prompt is
  # still live, so blindAfterSeconds answers it and takes the console moving
  # again as proof it was consumed. 120 s leaves the capture path's own repairs
  # their chance first, so a stale viewer is fixed as a viewer rather than typed
  # at. Note the contrast with the login: nudge below -- agetty redraws on a bare
  # Enter and this prompt does not, so the same recovery does not serve both.
  # The budget is sized for the SLOWEST host that runs this guest, not the
  # typical one. A timeout is a ceiling rather than a delay -- a host that
  # reaches the prompt in a minute matches and moves on, and pays nothing for
  # the headroom -- so the only cost of a generous value is how long a guest
  # that is genuinely never coming back takes to say so.
  #
  # 1800 s does not rescue this guest on an ARM64 Hyper-V host and is not
  # meant to: it reaches this prompt at around 2600 s there, where its 26.04
  # sibling takes 720 s on the same machine. That gap is why the 26.04 guest
  # is the one an ARM64 Hyper-V lab should run; the budget here is headroom
  # for an ordinarily slow host, not a fix for that one.
  - action: waitForAndEnter
    pattern: "Continue with autoinstall?"
    timeoutSeconds: 1800
    text: "yes"
    blindAfterSeconds: 120
    description: "OCR: Continue with autoinstall?"

  - action: retry
    maxAttempts: 3
    description: "Login and password rotation (restart on timeout)"
    steps:
      # The nudge comes BEFORE the wait, and that ordering is the whole point.
      # agetty prints "login:" once and does not reprint it; the installer's
      # closing console writes land after it and scroll it away. The prompt is
      # then gone from a screen that never changes again, so an OCR-only wait
      # can only spend its budget. The first redraw still leads the wait; the
      # wait itself then repeats that harmless redraw once a minute under the
      # SAME 1800 s wall-clock deadline. That makes recovery reachable without
      # shortening the install budget or multiplying password attempts.
      #
      # Enter is safe to send unconditionally: at a prompt it draws a fresh one,
      # and mid-boot it is discarded. The autoinstall prompt is already answered
      # by the waitForAndEnter ahead of this block, so nothing here can consume
      # it. Every retry attempt issues the first nudge, and the wait keeps doing
      # so while subiquity finishes and the installed agetty comes up.
      - action: pressKey
        name: Enter
        description: "Push agetty to redraw a fresh login"

      - action: waitForSeconds
        seconds: 2
        description: "Let agetty redraw"

      # The prompt is matched on the installed system's host name, not on a
      # bare "login:". This step straddles the installer-to-first-boot
      # reboot, and the console the installer leaves behind can present its
      # own login prompt seconds before the installed system exists. A bare
      # six-character token matches that dying console, and every step below
      # then types into a surface that is about to be replaced: the username
      # goes nowhere, and the password wait that follows spends its whole
      # budget on an agetty that was never given one. The host name only
      # appears once the installed system's getty is up, so anchoring on it
      # is what makes the match mean "the guest we are about to log into".
      # freshMatch confines the match to the console tail for the same
      # reason -- a prompt that has scrolled away is not one to type at.
      #
      # ${hostLabel} and not ${hostname}: the two differ whenever a guest is
      # named after its VM, because a VM name carries dots and agetty prints
      # only the first label. The full name reaches the console in exactly one
      # place, the /etc/issue banner directly above the prompt, so a pattern
      # built from ${hostname} matches only while that banner is on screen. It
      # stops matching the moment the banner scrolls -- with the prompt it is
      # waiting for still sitting there -- and then cannot fail fast either:
      # it spends the whole budget, and only the retry's Enter nudge, which
      # redraws the banner, recovers it. The label keeps every property the
      # anchor exists for; an installer console answering to a different name
      # is still rejected.
      - action: waitForTextWithNudge
        pattern: "${hostLabel} login:"
        timeoutSeconds: 1800
        nudgeKey: Enter
        nudgeIntervalSeconds: 60
        freshMatch: true
        # Fast-fail OCR scan: if subiquity crashed the installer drops to
        # a shell and the login: prompt will never appear -- short-circuit
        # so the inner runner's yuruna_retry backoff can auto-retry on a
        # fresh VM instead of burning the full 1800 s per attempt.
        failurePatterns:
          - "install_fail.crash"
          - "Press enter to start a shell"
          - "An error occurred"
        description: "OCR: ${hostLabel} login:"

      - action: passwdPrompt
        pattern: "${hostLabel} login:"
        freshMatch: true
        text: "${username}"
        description: "OCR: ${hostLabel} login:"

      # Bounded deliberately. A successful prompt arrives in seconds; the
      # only way this wait runs long is that the console moved on without
      # the username above ever landing, and no amount of further waiting
      # recovers that -- the retry block restarting from the login nudge
      # does. Inheriting the sequence-wide default here instead costs the
      # full default budget per attempt to reach a conclusion that is
      # already settled. The failure patterns are firmware-only strings
      # that cannot share a screen with a live password prompt, so they
      # end the attempt the moment the guest is seen to be rebooting.
      - action: passwdPrompt
        pattern: "Password:"
        timeoutSeconds: 30
        failurePatterns:
          - "BdsDxe:"
          - "GNU GRUB"
        text: "${currentPassword}"
        description: "OCR: Password:"

      - action: passwdPrompt
        pattern: ["Current password", "urrent password:"]
        text: "${currentPassword}"
        description: "OCR: Current password"

      - action: passwdPrompt
        pattern: ["New password", "ew password:"]
        text: "${newPassword}"
        description: "OCR: New password"

      - action: passwdPrompt
        pattern: ["Retype new password", "etype new password:"]
        text: "${newPassword}"
        description: "OCR: Retype new password"

  # Prove a shell exists before anything types a command at it. Every step
  # above matches a prompt, types, and returns; none of them establishes that
  # the rotation ended in a session rather than back at agetty. It can end at
  # agetty for ordinary reasons -- login's own LOGIN_TIMEOUT expiring, or a
  # keystroke landing while PAM has flushed the input queue -- and the console
  # then looks almost identical, because a freshly redrawn /etc/issue carries
  # the same hostname the steps above matched on. A workload typed into that
  # is consumed as a username and its output never appears, so the wait that
  # follows can only spend its whole budget before saying so. The shell prompt
  # is the one token agetty cannot produce, which is why it is the thing to
  # wait for; the sibling workload sequence guards its own fetchAndExecute the
  # same way. Bounded short: a session that exists shows its prompt at once,
  # and one that does not is not going to appear later.
  #
  # The prompt itself is not the thing to match, and cannot be. OCR matching
  # splits a pattern on the characters it strips -- "@" among them -- and
  # accepts it when every segment turns up somewhere in the text, in any
  # order, so "user@host" is two loose tokens that the line "host login:
  # user" already satisfies. Anchoring on the colon a shell prints before its
  # working directory does not rescue it either: normalization folds "." onto
  # ":", so a guest whose name carries a dot puts the very same token in the
  # /etc/issue banner sitting one line above the login prompt. The banner is
  # inside the freshMatch window too, so confining the match does not
  # separate them. A prompt-shaped pattern is a check that cannot fail here.
  #
  # So make the shell prove itself by computing something. agetty echoes a
  # typed line back verbatim and can produce nothing else; only a live shell
  # expands the substitution, so the expanded token on screen is proof a
  # session exists. The token is deliberately free of every character the
  # matcher splits on, which keeps segment matching out of it entirely and
  # leaves only the order-sensitive strategies -- and it differs from the
  # typed line by far more than the 15% of characters the match threshold
  # forgives, so the echo of the command cannot be mistaken for its output.
  - action: waitForSeconds
    seconds: 3
    description: "Let the login shell finish drawing before typing at it"

  # The leading space is a sacrificial character. On an ARM64 Hyper-V host the
  # first keystroke sent to a console that has just come up is dropped -- the
  # console shows "echo" arriving as "cho" and the shell answering "Command
  # 'cho' not found" -- and one lost character is enough to turn any typed
  # command into a different one. A space absorbs that loss: dropped, the
  # command still starts at "echo"; delivered, the shell ignores leading
  # whitespace. It costs nothing on a host that does not drop it. Being the
  # first thing typed after a login, this step also absorbs the loss on
  # behalf of every step below it, which type commands that a missing first
  # character would quietly turn into different ones.
  - action: inputTextAndEnter
    text: " echo yuruna_$(seq -s '' 1 9)_ok"
    description: "Ask the shell to expand a token agetty cannot"

  - action: waitForText
    pattern: "yuruna_123456789_ok"
    timeoutSeconds: 90
    freshMatch: true
    description: "OCR: yuruna_123456789_ok"

  # Persist only after the shell has proved that the rotated login completed.
  - action: callExtension
    method: authentication.SetPassword
    args:
      Username: "${username}"
      NewPassword: "${newPassword}"
    description: "Commit confirmed new password to auth system"

workload:
  - action: fetchAndExecute
    text: "/usr/local/lib/yuruna/fetch-and-execute.sh guest/ubuntu.server.24/ubuntu.server.24.update.sh"
    description: "ubuntu.server.24.update.sh"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 1800

  - action: saveSystemDiagnostic
    id: yuruna.update
    description: "Capture diagnostics"

  - action: inputTextAndEnter
    text: "clear; sudo reboot now"
    description: "Reboot the VM"
