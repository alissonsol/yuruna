sequenceGuid: 42946cbc-c2ec-48e4-a4ba-8e25a71c1286
sequenceRevision: 5

description: "Ubuntu Server 24.04: first login, change password, run update script, reboot."
keystrokeMechanism: gui

# --- REGION: resource
resource:
  ubuntu.server.24: []
variables:
  username: yuuser24
  currentPassword: ${ext:authentication.GetPassword(${username})}
  newPassword: ${ext:authentication.NewRandomPassword()}

# --- REGION: component
component:
  # See https://yuruna.link/42e220c4-0007
  - action: waitForAndEnter
    pattern: "Continue with autoinstall?"
    timeoutSeconds: 1800
    text: "yes"
    blindAfterSeconds: 120
    # The language menu means autoinstall never engaged, so this prompt is not
    # live and never will be. That screen satisfies the blind answer's own test
    # -- a menu waiting on a keystroke is static, and the keystroke moves it --
    # so without this the answer is typed into the list and reported consumed.
    blindSkipPattern: "Bahasa Indonesia"
    description: "OCR: Continue with autoinstall?"

  - action: retry
    maxAttempts: 3
    description: "Login and password rotation (restart on timeout)"
    steps:
      # See https://yuruna.link/42e220c4-0007
      - action: pressKey
        name: Enter
        description: "Push agetty to redraw a fresh login"

      - action: waitForSeconds
        seconds: 2
        description: "Let agetty redraw"

      # See https://yuruna.link/42e220c4-0007
      - action: waitForTextWithNudge
        pattern: "${hostLabel} login:"
        timeoutSeconds: 1800
        nudgeKey: Enter
        nudgeIntervalSeconds: 60
        freshMatch: true
        # Fail promptly on installer crashes or a rejected password rotation.
        failurePatterns:
          - "install_fail.crash"
          - "Press enter to start a shell"
          - "An error occurred"
          - "passwords do not match"
          - "Authentication token manipulation error"
        description: "OCR: ${hostLabel} login:"

      - action: passwdPrompt
        pattern: "${hostLabel} login:"
        freshMatch: true
        text: "${username}"
        description: "OCR: ${hostLabel} login:"

      # See https://yuruna.link/42e220c4-0007
      - action: passwdPrompt
        pattern: "Password:"
        timeoutSeconds: 30
        sinceStepStart: true
        failurePatterns:
          - "BdsDxe:"
          - "GNU GRUB"
        text: "${currentPassword}"
        description: "OCR: Password:"

      - action: passwdPrompt
        pattern: ["Current password", "urrent password:"]
        sinceStepStart: true
        text: "${currentPassword}"
        description: "OCR: Current password"

      # Keep the full token distinct from the current-password and retype prompts.
      - action: passwdPrompt
        pattern: "New password"
        sinceStepStart: true
        text: "${newPassword}"
        description: "OCR: New password"

      - action: passwdPrompt
        pattern: ["Retype new password", "etype new password:"]
        sinceStepStart: true
        text: "${newPassword}"
        description: "OCR: Retype new password"

  # See https://yuruna.link/42e220c4-0007
  - action: waitForSeconds
    seconds: 3
    description: "Let the login shell finish drawing before typing at it"

  # A leading space absorbs a dropped first keystroke on ARM64 Hyper-V.
  - action: inputTextAndEnter
    text: " echo yuruna_$(seq -s '' 1 9)_ok"
    description: "Ask the shell to expand a token agetty cannot"

  # Detect PAM rejection before persisting the password; ignore recovered login failures.
  - action: waitForText
    pattern: "yuruna_123456789_ok"
    timeoutSeconds: 90
    freshMatch: true
    failurePatterns:
      - "passwords do not match"
      - "BAD PASSWORD: The password fails the dictionary check"
      - "Authentication token manipulation error"
    description: "OCR: yuruna_123456789_ok"

  # Persist only after the shell has proved that the rotated login completed.
  - action: callExtension
    method: authentication.SetPassword
    args:
      Username: "${username}"
      NewPassword: "${newPassword}"
    description: "Commit confirmed new password to auth system"

# --- REGION: workload
workload:
  - action: fetchAndExecute
    text: "/usr/local/lib/yuruna/fetch-and-execute.sh guest/ubuntu.server.24/ubuntu.server.24.update.sh"
    description: "ubuntu.server.24.update.sh"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 1800

  - action: saveSystemDiagnostic
    id: yuruna.update
    description: "Capture diagnostics"

  - action: inputTextAndEnter
    text: "clear; sudo reboot now"
    description: "Reboot the VM"

  # See https://yuruna.link/42e220c4-0007
  - action: waitForSeconds
    seconds: 15
    description: "Let the reboot take the console"

  - action: waitForText
    pattern: "${hostLabel} login:"
    timeoutSeconds: 600
    freshMatch: true
    description: "OCR: ${hostLabel} login:"
