sequenceGuid: 420098a1-5755-4ff7-b551-73d01615ce5c
sequenceRevision: 3

description: "Ubuntu Server 26.04 (SSH): blind-keystroke-dismiss GRUB (OCR-free), then drive everything else over SSH once cloud-init has finished bringing up sshd."
keystrokeMechanism: ssh

# --- REGION: resource
resource:
  ubuntu.server.26: []
variables:
  username: yuuser26

# --- REGION: component
component:
  # OCR-free boot bridge: GRUB has no sshd yet, so dismiss the boot menu with a
  # blind keystroke (no framebuffer/OCR needed -- pressKey uses hypervisor key
  # injection, which works headless). Two attempts cover the menu's render
  # window; GRUB's own auto-boot timeout is the backstop if both mistime.
  - action: waitForSeconds
    seconds: 5
    description: "Let the GRUB boot menu render"

  - action: pressKey
    name: Enter
    description: "Blind-dismiss the GRUB boot menu (first attempt)"

  - action: waitForSeconds
    seconds: 8
    description: "Pause before retry"

  - action: pressKey
    name: Enter
    description: "Blind-dismiss the GRUB boot menu (retry)"

  - action: sshWaitReady
    timeoutSeconds: 2400
    # Fast-fail OCR scan: if subiquity aborts the installer drops to a shell and
    # sshd never starts -- without this list we'd burn the full 2400 s.
    # On match the step fails fast; the inner runner's yuruna_retry
    # backoff then auto-retries the cycle on a fresh VM.
    installerFailurePatterns:
      - "install_fail.crash"
      - "Press enter to start a shell"
      - "An error occurred"
    description: "Wait for SSH after autoinstall (fast-fail on subiquity crash)"

  - action: sshExec
    command: "whoami && hostname"
    description: "Smoke test: whoami/hostname"

# --- REGION: workload
workload:
  - action: sshFetchAndExecute
    command: "/usr/local/lib/yuruna/fetch-and-execute.sh guest/ubuntu.server.26/ubuntu.server.26.update.sh"
    timeoutSeconds: 1800
    description: "ubuntu.server.26.update.sh"

  # Observe the boot and CPU counters while the provisioned guest is still up.
  # This is advisory and runs only on native ARM64 Hyper-V.
  - action: saveGuestClockSnapshot
    phase: before-cpu-restart
    description: "Capture clocks and CPU accounting before the processor restart"

  # Force off a guest that ignores the request so the processor change below still happens.
  # See https://yuruna.link/428e4df6-003b
  - action: stopVm
    timeoutSeconds: 120
    forceOnTimeout: true
    frameIntervalSeconds: 30
    description: "Power off after provisioning"

  # ARM64 Hyper-V provisions with one vCPU to avoid the measured intercept
  # storm, then returns to kubeadm's two-CPU minimum before later workloads.
  # Other hosts retain their configured processor count; startVm just restarts
  # the guest after the same host-observed shutdown.
  - action: startVm
    arm64HyperVProcessorCount: 2
    timeoutSeconds: 180
    description: "Restore workload processors and start the VM"

  - action: sshWaitReady
    timeoutSeconds: 600
    description: "Wait for SSH after the provisioning power cycle"

  # Use only the address already proven during provisioning; do not wait for
  # networking or extend the boot recovery policy to collect diagnostics.
  - action: saveGuestClockSnapshot
    phase: after-cpu-restart
    description: "Capture clocks and CPU accounting after the processor restart"
