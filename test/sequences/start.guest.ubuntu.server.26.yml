sequenceGuid: 427b2ba5-58ee-4873-9737-869138b121fe
sequenceRevision: 2

description: "Ubuntu Server 26.04: first login, change password, run update script, reboot."
keystrokeMechanism: gui
resource:
  ubuntu.server.26: []
variables:
  username: yuuser26
  currentPassword: ${ext:authentication.GetPassword(${username})}
  newPassword: ${ext:authentication.NewRandomPassword()}

component:
  - action: waitForAndEnter
    pattern: "Continue with autoinstall?"
    timeoutSeconds: 900
    text: "yes"
    description: "OCR: Continue with autoinstall?"

  - action: retry
    maxAttempts: 3
    description: "Login, password rotation, and vault commit (restart on timeout)"
    steps:
      # The nudge comes BEFORE the wait, and that ordering is the whole point.
      # agetty prints "login:" once and does not reprint it; the installer's
      # closing console writes land after it and scroll it away. The prompt is
      # then gone from a screen that never changes again, so an OCR wait for it
      # can only spend its budget -- 1800 s per attempt here, three attempts, an
      # hour and a half to reach a foregone conclusion. An ordering that waited
      # first and nudged second would put the recovery downstream of the very
      # step it exists to unblock, and since a retry attempt restarts at this
      # step, no attempt would ever reach it.
      #
      # Enter is safe to send unconditionally: at a prompt it draws a fresh one,
      # and mid-boot it is discarded. The autoinstall prompt is already answered
      # by the waitForAndEnter ahead of this block, so nothing here can consume
      # it. Every retry attempt issues the nudge, so a prompt overwritten during
      # one attempt is recovered by the next.
      - action: pressKey
        name: Enter
        description: "Push agetty to redraw a fresh login"

      - action: waitForSeconds
        seconds: 2
        description: "Let agetty redraw"

      - action: waitForText
        pattern: "login:"
        timeoutSeconds: 1800
        # Fast-fail OCR scan: if subiquity crashed the installer drops to
        # a shell and the login: prompt will never appear -- short-circuit
        # so the inner runner's yuruna_retry backoff can auto-retry on a
        # fresh VM instead of burning the full 1800 s per attempt.
        failurePatterns:
          - "install_fail.crash"
          - "Press enter to start a shell"
          - "An error occurred"
        description: "OCR: login:"

      - action: passwdPrompt
        pattern: "login:"
        text: "${username}"
        description: "OCR: login:"

      - action: passwdPrompt
        pattern: "Password:"
        text: "${currentPassword}"
        description: "OCR: Password:"

      - action: passwdPrompt
        pattern: ["Current password", "urrent password:"]
        text: "${currentPassword}"
        description: "OCR: Current password"

      - action: passwdPrompt
        pattern: ["New password", "ew password:"]
        text: "${newPassword}"
        description: "OCR: New password"

      - action: passwdPrompt
        pattern: ["Retype new password", "etype new password:"]
        text: "${newPassword}"
        description: "OCR: Retype new password"

      - action: callExtension
        method: authentication.SetPassword
        args:
          Username: "${username}"
          NewPassword: "${newPassword}"
        description: "Commit new password to auth system"

workload:
  - action: fetchAndExecute
    text: "/usr/local/lib/yuruna/fetch-and-execute.sh guest/ubuntu.server.26/ubuntu.server.26.update.sh"
    description: "ubuntu.server.26.update.sh"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 1800

  - action: saveSystemDiagnostic
    id: yuruna.update
    description: "Capture diagnostics"

  - action: inputTextAndEnter
    text: "clear; sudo reboot now"
    description: "Reboot the VM"
