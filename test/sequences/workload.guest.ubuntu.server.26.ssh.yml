sequenceGuid: 42bd1227-31bc-4c7d-96a0-406ce0baa7ab
sequenceRevision: 1

description: "Ubuntu Server 26.04 (SSH): install VS Code and verify."
keystrokeMechanism: ssh
resource:
  ubuntu.server.26:
    - start.guest.ubuntu.server.26.ssh
variables:
  username: yuuser26

component:
  - action: sshWaitReady
    timeoutSeconds: 300
    description: "Wait for sshd after reboot"

  - action: sshExec
    command: "whoami && hostname"
    description: "Smoke test: whoami/hostname"

workload:
  # Kept equal to the console variant's budget for the same script on the same
  # guest: what this costs is dominated by how fast the guest unpacks and
  # configures the JDK's 24 packages and Code's 149, which is a property of the
  # host. Code is asked for with --no-install-recommends, so that second count
  # is the ceiling rather than the current figure. The console
  # twin carries the measurement the number comes from. Driving over SSH does
  # appear to be the cheaper of the two -- the update script on this guest ran
  # 153 s over SSH against 253-288 s on the console -- but that was measured
  # across cycles rather than back to back, so it sizes nothing here; a budget
  # is a ceiling, and the ceiling is the slow path either way.
  - action: sshFetchAndExecute
    command: "/usr/local/lib/yuruna/fetch-and-execute.sh guest/ubuntu.server.26/ubuntu.server.26.code.sh"
    timeoutSeconds: 3000
    description: "ubuntu.server.26.code.sh"

  - action: sshExec
    command: "dpkg -l | grep -i 'code ' || true"
    allowFailure: true
    description: "Show installed VS Code package"
