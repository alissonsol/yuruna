# Standalone SMOKE TEST of the stash daemon build + launch on a vanilla
# Ubuntu guest (no NAS seed -> the daemon uses local-fallback storage).
# It is NOT the production bring-up and is NOT wired into automated test-sets;
# run it manually to verify the daemon compiles + starts.

sequenceGuid: 42e26897-db3b-4d98-b923-5f39ad3349bb
sequenceRevision: 2

description: "Ubuntu Server 26.04: log in as stash-admin and bring up the Yuruna stash service daemon."
keystrokeMechanism: gui
resource:
  ubuntu.server.26:
    - start.guest.ubuntu.server.26
variables:
  # The stash-service VM's cloud-init creates only 'stash-admin' (passwordless sudo
  # + vault password); use it for console login. The bring-up script runs
  # many sudo commands, so a NOPASSWD account is required here.
  username: stash-admin

component:
  - action: retry
    maxAttempts: 2
    description: "Login + retry"
    steps:
      - snippet: firstLoginPrime

      - action: passwdPrompt
        pattern: "login:"
        timeoutSeconds: 600
        text: "${username}"
        description: "OCR: login:"

      - action: passwdPrompt
        pattern: "Password:"
        text: "${ext:authentication.GetPassword(${username})}"
        description: "OCR: Password:"

  # Prove a shell exists before typing a workload at it, by making it compute
  # something agetty cannot. A prompt-shaped pattern cannot do this job: OCR
  # matching splits on the characters it strips, "@" included, and accepts
  # segments in any order, so "user@host" is satisfied by the line "host
  # login: user"; and normalization folds "." onto ":", so the colon a shell
  # prints before its working directory is also present in the /etc/issue
  # banner of any guest whose name carries a dot. agetty echoes a typed line
  # verbatim and can produce nothing else, so the expanded token is the proof.
  # It carries no character the matcher splits on, which keeps segment
  # matching out of it and leaves order enforced.
  - action: waitForSeconds
    seconds: 3
    description: "Let the login shell finish drawing before typing at it"

  # The leading space is a sacrificial character. On an ARM64 Hyper-V host the
  # first keystroke sent to a console that has just come up is dropped -- the
  # console shows "echo" arriving as "cho" and the shell answering "Command
  # 'cho' not found" -- and one lost character is enough to turn any typed
  # command into a different one. A space absorbs that loss: dropped, the
  # command still starts at "echo"; delivered, the shell ignores leading
  # whitespace. It costs nothing on a host that does not drop it. Being the
  # first thing typed after a login, this step also absorbs the loss on
  # behalf of every step below it, which type commands that a missing first
  # character would quietly turn into different ones.
  - action: inputTextAndEnter
    text: " echo yuruna_$(seq -s '' 1 9)_ok"
    description: "Ask the shell to expand a token agetty cannot"

  - action: waitForText
    pattern: "yuruna_123456789_ok"
    timeoutSeconds: 90
    freshMatch: true
    description: "OCR: yuruna_123456789_ok"

workload:
  - action: fetchAndExecute
    text: "/usr/local/lib/yuruna/fetch-and-execute.sh guest/ubuntu.server.26/ubuntu.server.26.stash-service.sh"
    description: "ubuntu.server.26.stash-service.sh"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 900

  - action: inputTextAndEnter
    text: "clear; exit;"
    description: "Exit back to login"
