sequenceGuid: 422cbc66-4a66-47de-9487-d08b4c3b97cd
sequenceRevision: 2

description: "Ubuntu Server 26.04: log in, install VS Code via the guest.ubuntu.server.26 workload scripts."
keystrokeMechanism: gui

# --- REGION: resource
resource:
  ubuntu.server.26:
    - start.guest.ubuntu.server.26
variables:
  username: yuuser26

# --- REGION: component
component:
  - action: retry
    maxAttempts: 2
    description: "Login + retry"
    steps:
      - snippet: firstLoginPrime

      - action: passwdPrompt
        pattern: "login:"
        timeoutSeconds: 600
        text: "${username}"
        description: "OCR: login:"

      - action: passwdPrompt
        pattern: "Password:"
        text: "${ext:authentication.GetPassword(${username})}"
        description: "OCR: Password:"

  # See https://yuruna.link/42e220c4-0007
  - action: waitForSeconds
    seconds: 3
    description: "Let the login shell finish drawing before typing at it"

  # A leading space absorbs a dropped first keystroke on ARM64 Hyper-V.
  - action: inputTextAndEnter
    text: " echo yuruna_$(seq -s '' 1 9)_ok"
    description: "Ask the shell to expand a token agetty cannot"

  - action: waitForText
    pattern: "yuruna_123456789_ok"
    timeoutSeconds: 90
    freshMatch: true
    description: "OCR: yuruna_123456789_ok"

# --- REGION: workload
workload:
  # See https://yuruna.link/42e220c4-0007
  - action: fetchAndExecute
    text: "/usr/local/lib/yuruna/fetch-and-execute.sh guest/ubuntu.server.26/ubuntu.server.26.code.sh"
    description: "ubuntu.server.26.code.sh"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 3000

  - action: inputTextAndEnter
    text: "clear; exit;"
    description: "Exit back to login"
