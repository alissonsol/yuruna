<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover + safe-area-inset support; see yuruna.common.css. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="public, max-age=60, must-revalidate">
  <title data-i18n="status.diagnostics_yuruna">Diagnostics — Yuruna</title>
  <link rel="stylesheet" href="yuruna.common.css">
  <style>
    /* dvh first-class, vh as the fallback: iOS Safari's 100vh is the large
       viewport, so the last flex child sits below the fold until the toolbars
       retract. */
    body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

    #banner-user-row {
      margin-inline-start: auto;
      flex: 0 0 auto;
      font-size: .75rem;
      color: rgba(255,255,255,.92);
      background: transparent;
    }
    #banner-user {
      font-family: var(--font-mono);
      font-weight: 600;
    }

    /* Plain shorthand first as the fallback; the max()/env() longhand then holds
       the dump clear of the notch in landscape, where viewport-fit=cover lets
       <main> reach the display edge. env() is 0 without a safe area. */
    main {
      flex: 1; max-width: 1100px; width: 100%; margin: 0 auto;
      padding: 1.25rem 1.5rem;
      padding: 1.25rem max(1.5rem, env(safe-area-inset-right)) 1.25rem max(1.5rem, env(safe-area-inset-left));
    }
    pre#diagnostics-output {
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: .5rem;
      padding: 1rem 1.25rem;
      font-family: var(--font-mono); font-size: .75rem;
      line-height: 1.4;
      white-space: pre-wrap; word-break: break-word;
      color: var(--fg-primary);
    }
    pre#diagnostics-output.loading { color: var(--fg-faint); font-style: italic; }
    pre#diagnostics-output.error   { color: var(--fail-fg); background: var(--fail-soft-bg); border-color: var(--fail-soft-border); }

    /* Host update and host repair, below the report: each has its own live
       region, so its progress never overwrites the diagnostic report, and the
       reverse. The repair stays hidden until the host advertises one it can
       run; the update shows on every host. The sections are the bottom of the
       page, so the side safe areas are kept clear as for <main> above, and
       their container clears the bottom one whichever section is last shown. */
    .host-operation {
      padding: .5rem 1.5rem;
      padding-left: max(1.5rem, env(safe-area-inset-left));
      padding-right: max(1.5rem, env(safe-area-inset-right));
      border-top: 1px solid var(--border);
      background: var(--bg-elevated);
      font-size: .75rem;
    }
    #host-operations { padding-bottom: env(safe-area-inset-bottom); background: var(--bg-elevated); }
    /* The scope select takes the touch floor the buttons beside it get from
       yuruna.common.css, which sizes only buttons. */
    @media (any-pointer: coarse) {
      #host-update-scope { min-height: var(--touch-min); }
    }
    .host-operation-title { font-size: .8125rem; margin: 0 0 .25rem; }
    .host-operation-note  { color: var(--fg-muted); margin: 0 0 .5rem; max-width: 72ch; line-height: 1.4; }
    .host-operation-actions > * + * { margin-inline-start: .5rem; }
    .host-operation-status { min-height: 1.25rem; margin-top: .5rem; color: var(--fg-muted); }
    .host-operation-status.error { color: var(--fail-fg); }
    .host-operation-status.ok    { color: var(--pass-fg); }
    .host-operation-btn {
      border-radius: .375rem;
      font-weight: 600;
      font-family: inherit; cursor: pointer;
      border: 1px solid transparent;
    }
    .host-operation-btn.secondary {
      background: var(--meta-btn-bg); color: var(--meta-btn-fg);
      border-color: var(--meta-btn-border);
    }
    .host-operation-btn.secondary:hover { background: var(--meta-btn-hover-bg); }
    .host-operation-btn.destructive {
      background: var(--destructive-bg); color: var(--fg-header);
      border-color: var(--destructive-border);
    }
    .host-operation-btn.destructive:hover:not([disabled]) { background: var(--destructive-hover-bg); }
    .host-operation-btn.destructive[disabled] { background: var(--destructive-disabled-bg); cursor: default; }
  </style>
</head>
<body>

<header class="app">
  <div class="brand">
    <span class="name"><a href="index.html"><span id="header-title">Yuruna</span></a></span>
    <span class="version" id="header-version"></span>
  </div>
  <span class="spacer"></span>
  <span class="machine" id="header-machine"></span>
  <div class="menu">
    <button type="button" class="menu-button" id="menu-button" aria-haspopup="true" aria-expanded="false" aria-controls="menu-panel">
      <span class="menu-icon" aria-hidden="true">&#9776;</span><span class="menu-label" data-i18n="status.menu">Menu</span>
    </button>
    <nav class="menu-panel" id="menu-panel" aria-label="Pages" hidden data-i18n-aria-label="status.pages">
      <a href="index.html" data-i18n="status.status">Status</a>
      <a href="config.html" data-i18n="status.config">Config</a>
      <a href="performance.html" data-i18n="status.performance">Performance</a>
      <a href="diagnostics.html" aria-current="page" data-i18n="status.diagnostics">Diagnostics</a>
      <a class="menu-out" href="https://yuruna.link/42ad660e" target="_blank" rel="noopener" data-i18n="status.guide">Guide</a>
    </nav>
  </div>
</header>

<div id="banner" class="idle">
  <span class="dot"></span>
  <span id="banner-text" role="status" aria-atomic="true" data-i18n="status.loading">Loading…</span>
  <span id="banner-user-row"><span data-i18n="status.user_account">User account:</span> <span id="banner-user">—</span></span>
</div>

<main>
  <h1 class="sr-only" data-i18n="status.host_diagnostics">Host diagnostics</h1>
  <pre id="diagnostics-output" role="status" class="loading">Running Get-SystemDiagnostic on host…</pre>
</main>

<div id="host-operations">
  <section id="host-update" class="host-operation" hidden aria-labelledby="host-update-title">
    <h2 id="host-update-title" class="host-operation-title"></h2>
    <p id="host-update-note" class="host-operation-note"></p>
    <div class="host-operation-actions">
      <select id="host-update-scope" aria-labelledby="host-update-title"></select>
      <button type="button" class="host-operation-btn destructive" id="host-update-start"></button>
    </div>
    <div id="host-update-status" class="host-operation-status" role="status" aria-live="polite" aria-atomic="true"></div>
  </section>

  <section id="host-repair" class="host-operation" hidden aria-labelledby="host-repair-title">
    <h2 id="host-repair-title" class="host-operation-title"></h2>
    <p id="host-repair-note" class="host-operation-note"></p>
    <div class="host-operation-actions">
      <button type="button" class="host-operation-btn destructive" id="host-repair-start"></button>
      <button type="button" class="host-operation-btn secondary" id="host-repair-retry" hidden></button>
    </div>
    <div id="host-repair-status" class="host-operation-status" role="status" aria-live="polite" aria-atomic="true"></div>
  </section>
</div>

<script src="yuruna.common.js"></script>

</body>
</html>
